# 백엔드 3개(녹지 부족지수 · 후보지 추천 · 녹지 설계)를 한 서버에 띄운다. AI 서버는 제외.
# 실행: docker compose up -d --build   → http://localhost:8080
# 자세한 내용: DEPLOY.md
services:
  deficit:
    build:
      context: .
      dockerfile: deploy/deficit.Dockerfile
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  candidate:
    build:
      context: .
      dockerfile: deploy/candidate.Dockerfile
    restart: unless-stopped
    expose: ["8001"]
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RECOMMENDATION_DB: /data/recommendations.sqlite3
    volumes:
      - candidate-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  design:
    build:
      context: .
      dockerfile: deploy/design.Dockerfile
    restart: unless-stopped
    expose: ["8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - deficit
      - candidate
      - design

volumes:
  candidate-data:
