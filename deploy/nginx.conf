# 하나의 주소로 받아서 경로별로 각 백엔드에 넘긴다 (접두어는 떼고 넘김)
#   /deficit/*   → 녹지 부족지수 (deficit:8000)
#   /candidate/* → 후보지 추천   (candidate:8001)
#   /design/*    → 녹지 설계     (design:8002)
server {
    listen 80;
    client_max_body_size 20m;

    # 서비스를 다시 빌드하면 컨테이너 IP 가 바뀐다. Docker 내부 DNS 로 매번 다시 찾도록 해서
    # nginx 를 재시작하지 않아도 502 가 나지 않게 한다 (그래서 proxy_pass 에 변수를 쓴다).
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = / {
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html><meta charset="utf-8"><title>2026SWAITHON API</title><h1>2026SWAITHON 백엔드</h1><ul><li><a href="/deficit/docs">녹지 부족지수 API</a></li><li><a href="/candidate/docs">후보지 추천 API</a></li><li><a href="/design/docs">녹지 설계 API</a></li></ul>';
    }

    location /deficit/ {
        set $upstream deficit:8000;
        rewrite ^/deficit/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /candidate/ {
        set $upstream candidate:8001;
        rewrite ^/candidate/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /design/ {
        set $upstream design:8002;
        rewrite ^/design/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
}
