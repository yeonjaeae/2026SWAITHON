# 하나의 주소로 받아서 경로별로 각 백엔드에 넘긴다 (접두어는 떼고 넘김)
#   /deficit/*   → 녹지 부족지수 (deficit:8000)
#   /candidate/* → 후보지 추천   (candidate:8001)
#   /design/*    → 녹지 설계     (design:8002)
server {
    listen 80;
    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = / {
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html><meta charset="utf-8"><title>2026SWAITHON API</title><h1>2026SWAITHON 백엔드</h1><ul><li><a href="/deficit/docs">녹지 부족지수 API</a></li><li><a href="/candidate/docs">후보지 추천 API</a></li><li><a href="/design/docs">녹지 설계 API</a></li></ul>';
    }

    location /deficit/ {
        proxy_pass http://deficit:8000/;
    }

    location /candidate/ {
        proxy_pass http://candidate:8001/;
    }

    location /design/ {
        proxy_pass http://design:8002/;
    }
}
